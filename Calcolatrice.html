<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Calcolatrice a Stringa - Esercizio 4A</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calcolatrice-container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 1.2rem;
        }
        .inputs-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .inputs-group input {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            text-align: right;
        }
        .inputs-group input:focus {
            border-color: #e67e22;
        }
        .tastiera-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #f8f9fa;
            color: #333;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #e2e6ea;
        }
        .btn.attivo {
            background-color: #e67e22;
            color: white;
        }
        .btn-uguale {
            grid-column: span 4;
            background-color: #2ecc71;
            color: white;
        }
        .btn-uguale:hover {
            background-color: #27ae60;
        }
        .risultato-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f1f3f5;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #495057;
            min-height: 54px;
            border-left: 5px solid #e67e22;
            word-break: break-all; 
        }
    </style>
</head>
<body>

    <div class="calcolatrice-container">
        <h2>Semi-Calcolatrice (String-Mode)</h2>
        
        <div class="inputs-group">
            <input type="text" id="num1" placeholder="Primo numero">
            <input type="text" id="num2" placeholder="Secondo numero">
        </div>
        <div class="tastiera-grid">
            <button class="btn btn-op" onclick="componiStringa('+', this)">+</button>
            <button class="btn btn-op" onclick="componiStringa('-', this)">-</button>
            <button class="btn btn-op" onclick="componiStringa('*', this)">*</button>
            <button class="btn btn-op" onclick="componiStringa('/', this)">/</button>
            
            <button class="btn btn-uguale" onclick="eseguiEspressione()">=</button>
        </div>
        <div class="risultato-box" id="output">
            In attesa...
        </div>
    </div>

    <script>
        let operatoreScelto = "";
        function componiStringa(operatore, bottone) {
            operatoreScelto = operatore;
            let bottoni = document.querySelectorAll('.btn-op');
            bottoni.forEach(b => b.classList.remove('attivo'));
            bottone.classList.add('attivo');
        }
        function eseguiEspressione() {
            let txt1 = document.getElementById("num1").value.trim();
            let txt2 = document.getElementById("num2").value.trim();
            let display = document.getElementById("output");
            if (txt1 === "" || txt2 === "") {
                display.innerHTML = "Errore: Campi vuoti!";
                return;
            }
            if (operatoreScelto === "") {
                display.innerHTML = "Errore: Scegli l'operazione!";
                return;
            }
            txt1 = txt1.replace(',', '.');
            txt2 = txt2.replace(',', '.');

            if (isNaN(txt1) || isNaN(txt2)) {
                display.innerHTML = "Errore: Dati non numerici!";
                return;
            }
            if (operatoreScelto === "/" && parseFloat(txt2) === 0) {
                display.innerHTML = "Errore: Divisione per 0!";
                return;
            }
            let espressioneCompleta = txt1 + " " + operatoreScelto + " " + txt2;
            try {
                let calcolatore = new Function("return " + espressioneCompleta);
                let risultato = calcolatore();
                display.innerHTML = "Espressione: " + espressioneCompleta + "<br>Risultato: " + risultato;
            } catch (errore) {
                display.innerHTML = "Errore nel calcolo della stringa";
            }
        }
    </script>
</body>
</html>
